<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Your Zist Dashboard</title>
  <meta name="description" content="Your personalized health dashboard — saved assessment results, progress tracking, and recommendations." />
  <style>
    :root {
      --ink: #16211d;
      --muted: #66736e;
      --line: #dce5e1;
      --soft: #f4f8f6;
      --brand: #1d5b4f;
      --brand2: #2f7d6c;
      --warn: #8a4b12;
      --warnbg: #fff7ed;
      --danger: #8a2330;
      --dangerbg: #fff1f2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f4f8f6 0, #ffffff 34%);
      color: var(--ink);
      min-height: 100vh;
    }
    .shell { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 72px; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 36px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -0.02em; text-decoration: none; color: var(--ink); }
    .mark { width: 34px; height: 34px; border-radius: 50%; background: var(--brand); display: grid; place-items: center; color: white; font-weight: 900; font-size: 16px; }
    .signout { font-size: 13px; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; cursor: pointer; transition: border .15s ease, color .15s ease; width: auto; }
    .signout:hover { border-color: var(--brand2); color: var(--brand); }
    h1 { font-size: clamp(28px, 5vw, 42px); line-height: 1.04; letter-spacing: -0.035em; margin: 0 0 8px; }
    h2 { font-size: 22px; margin: 0 0 12px; }
    h3 { font-size: 16px; margin: 0 0 6px; }
    .eyebrow { color: var(--brand); font-size: 13px; text-transform: uppercase; letter-spacing: .12em; font-weight: 800; margin-bottom: 12px; }
    .muted { color: var(--muted); }
    .loading { text-align: center; padding: 80px 20px; color: var(--muted); }
    .card { background: white; border: 1px solid var(--line); border-radius: 20px; padding: 28px; box-shadow: 0 16px 48px rgba(23,52,44,.06); margin-bottom: 20px; }
    .score-row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
    .score-big { font-size: 56px; font-weight: 850; letter-spacing: -0.055em; line-height: 1; }
    .score-big small { font-size: 18px; color: var(--muted); font-weight: 600; }
    .assessment-name { font-size: 14px; color: var(--brand); font-weight: 600; margin-bottom: 10px; text-transform: uppercase; letter-spacing: .08em; }
    .completed-date { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
    .domain { margin: 14px 0; }
    .domain-head { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 7px; font-size: 14px; }
    .bar { height: 8px; background: #edf1ef; border-radius: 99px; overflow: hidden; }
    .bar span { display: block; height: 100%; background: var(--brand2); border-radius: 99px; transition: width .6s ease; }
    .result-box { padding: 16px; border-radius: 14px; background: var(--soft); margin: 16px 0; }
    .recs { display: grid; gap: 12px; margin-top: 16px; }
    .rec { border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
    .warning { padding: 14px; border-radius: 12px; margin: 10px 0; background: var(--warnbg); border: 1px solid #fed7aa; font-size: 13px; line-height: 1.6; }
    .warning.important { background: var(--dangerbg); border-color: #fecdd3; }
    .empty-state { text-align: center; padding: 60px 20px; }
    .empty-state h2 { margin: 0 0 10px; }
    .empty-state p { color: var(--muted); font-size: 15px; margin: 0 0 24px; }
    .start-btn { display: inline-block; background: var(--brand); color: white; border-radius: 999px; padding: 13px 26px; font-weight: 700; text-decoration: none; font-size: 15px; transition: background .15s ease; }
    .start-btn:hover { background: var(--brand2); }
    .chart-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; padding: 0 4px; }
    .chart-svg { display: block; width: 100%; height: auto; min-width: 480px; }
    .retake-btn { display: inline-block; background: var(--brand); color: white; border-radius: 999px; padding: 13px 26px; font-weight: 700; font-size: 15px; border: none; cursor: pointer; transition: background .15s ease, opacity .15s ease; }
    .retake-btn:hover { background: var(--brand2); }
    .retake-btn:disabled { opacity: 0.6; cursor: default; }
    .rec-checkable { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
    .rec-checkable:hover { border-color: var(--brand2); }
    .rec-checkbox { margin-top: 3px; accent-color: var(--brand2); flex-shrink: 0; width: 18px; height: 18px; }
    .rec-checkable .rec-content { flex: 1; }
    .rec-checkable.rec-done .rec-content { text-decoration: line-through; opacity: 0.55; }
    .rec-checkable.rec-done .rec-content h3 { color: var(--muted); }
    .rec-checkable.rec-done .rec-content h3::after { content: ' \u2713'; color: var(--brand2); }
    .foot { margin-top: 28px; font-size: 12px; color: var(--muted); line-height: 1.6; }
    @media (max-width: 600px) {
      .shell { width: min(100% - 20px, 760px); }
      .card { padding: 22px 18px; }
      .score-big { font-size: 46px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="header">
      <a class="brand" href="/"><div class="mark">Z</div><div>Zist Health</div></a>
      <button class="signout" id="signout-btn">Sign out</button>
    </div>
    <div id="app"><div class="loading">Loading your dashboard…</div></div>
    <div class="foot">
      Zist provides wellness education and does not provide medical diagnosis or treatment.
    </div>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const app = document.getElementById('app');

    let supabase;

    function escHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    }

    const DOMAIN_LABELS = {
      duration: 'Sleep Duration',
      regularity: 'Sleep Regularity',
      satisfaction: 'Sleep Satisfaction',
      continuity: 'Sleep Continuity',
      alertness: 'Daytime Alertness & Recovery',
      timing: 'Sleep Timing & Alignment',
    };

    function formatDate(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleDateString('en-US', {
        month: 'long', day: 'numeric', year: 'numeric',
      });
    }

    function formatShortDate(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleDateString('en-US', {
        month: 'short', day: 'numeric',
      });
    }

    // ── Progress-over-time SVG line chart (shown when 2+ completed) ──
    function renderProgressChart(completed) {
      const points = (completed || [])
        .filter(a => a.completedAt && a.overallScore != null)
        .sort((a, b) => new Date(a.completedAt) - new Date(b.completedAt));
      if (points.length < 2) return '';

      const W = 700, H = 220;
      const padL = 44, padR = 20, padT = 24, padB = 44;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;
      const n = points.length;
      const xAt = i => padL + (n === 1 ? 0 : (i * plotW / (n - 1)));
      const yAt = score => padT + (1 - Math.max(0, Math.min(100, Number(score))) / 100) * plotH;

      let grid = '';
      for (const v of [0, 50, 100]) {
        const y = yAt(v);
        grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${(W - padR).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#dce5e1" stroke-width="1" />`;
        grid += `<text x="${(padL - 8).toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="#66736e">${v}</text>`;
      }

      let linePath = '';
      let dots = '';
      let labels = '';
      for (let i = 0; i < n; i++) {
        const x = xAt(i);
        const y = yAt(points[i].overallScore);
        linePath += `${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${y.toFixed(1)} `;
        dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="#2f7d6c" stroke="white" stroke-width="2" />`;
        labels += `<text x="${x.toFixed(1)}" y="${(H - padB + 22).toFixed(1)}" text-anchor="middle" font-size="12" fill="#66736e">${escHtml(formatShortDate(points[i].completedAt))}</text>`;
        labels += `<text x="${x.toFixed(1)}" y="${(y - 10).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="#1d5b4f">${Math.round(Number(points[i].overallScore))}</text>`;
      }

      return `
        <div class="card">
          <h2>Progress over time</h2>
          <div class="chart-scroll">
            <svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sleep and Recovery overall score over time">
              ${grid}
              <path d="${linePath.trim()}" fill="none" stroke="#2f7d6c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
              ${dots}
              ${labels}
            </svg>
          </div>
        </div>
      `;
    }

    // ── Reassessment: create a new invited instance and redirect to it ──
    async function retakeAssessment() {
      const btn = document.getElementById('retake-btn');
      if (!btn) return;
      btn.disabled = true;
      const original = btn.textContent;
      btn.textContent = 'Starting…';
      track('reassessment_started');
      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) {
          window.location.href = '/register';
          return;
        }
        const res = await fetch('/api/dashboard', {
          method: 'POST',
          headers: { Authorization: `Bearer ${session.access_token}` },
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || 'Could not start a new assessment');
        }
        const data = await res.json();
        if (!data || !data.accessToken) {
          throw new Error('No access token returned');
        }
        window.location.href = `/a/${data.accessToken}`;
      } catch (err) {
        btn.disabled = false;
        btn.textContent = original;
        alert(err && err.message ? err.message : 'Something went wrong. Please try again.');
      }
    }

    // ── Privacy-conscious analytics ──
    function track(eventType, metadata) {
      fetch('/api/track', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ eventType, metadata: metadata || {} }),
      }).catch(() => {});
    }

    // ── Feedback widget ──
    function renderFeedback(session) {
      const existing = document.getElementById('feedback-section');
      if (existing) return;

      const fb = document.createElement('div');
      fb.id = 'feedback-section';
      fb.className = 'card';
      fb.style.textAlign = 'center';
      fb.style.borderStyle = 'dashed';
      fb.innerHTML = `
        <h2>How are we doing?</h2>
        <p class="muted" style="font-size:14px;margin:0 0 16px">We'd love to hear what's working or what could be better.</p>
        <div id="feedback-form" style="max-width:480px;margin:0 auto">
          <textarea id="feedback-msg" placeholder="Share your thoughts…" style="width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:var(--ink);outline:none;resize:vertical;min-height:80px;margin-bottom:10px" maxlength="2000"></textarea>
          <button id="feedback-submit" class="retake-btn" style="width:auto;padding:10px 22px">Send feedback</button>
        </div>
        <div id="feedback-done" style="display:none;color:var(--brand);font-size:14px;margin-top:12px">Thank you! Your feedback helps us improve.</div>
      `;
      app.appendChild(fb);

      const submitBtn = document.getElementById('feedback-submit');
      submitBtn.addEventListener('click', async () => {
        const msg = document.getElementById('feedback-msg').value.trim();
        if (!msg) return;
        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending…';
        try {
          const headers = { 'Content-Type': 'application/json' };
          if (session) headers.Authorization = `Bearer ${session.access_token}`;
          await fetch('/api/feedback', {
            method: 'POST',
            headers,
            body: JSON.stringify({ message: msg }),
          });
          document.getElementById('feedback-form').style.display = 'none';
          document.getElementById('feedback-done').style.display = 'block';
          track('feedback_submitted');
        } catch (e) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send feedback';
          alert('Could not send feedback. Please try again.');
        }
      });
    }

    async function init() {
      try {
        // ── Fetch Supabase config ──
        const configRes = await fetch('/api/auth-config');
        if (!configRes.ok) throw new Error('Could not load config');
        const { url, anonKey } = await configRes.json();

        supabase = createClient(url, anonKey, {
          auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
        });

        // ── Check auth state ──
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) {
          window.location.href = '/register';
          return;
        }

        // ── Sign out handler ──
        document.getElementById('signout-btn').addEventListener('click', async () => {
          await supabase.auth.signOut();
          window.location.href = '/';
        });

        // ── Fetch dashboard data ──
        const dashRes = await fetch('/api/dashboard', {
          headers: { Authorization: `Bearer ${session.access_token}` },
        });

        if (!dashRes.ok) {
          const err = await dashRes.json().catch(() => ({}));
          throw new Error(err.error || 'Could not load dashboard');
        }

        const data = await dashRes.json();
        track('dashboard_viewed', { completed: (data.assessments || []).filter(a => a.status === 'completed').length });
        renderDashboard(data);
      } catch (err) {
        app.innerHTML = `<div class="loading" style="color:var(--danger)">${escHtml(err.message || 'Something went wrong.')}</div>`;
      }
    }

    function renderDashboard(data) {
      const { user, participant, assessments } = data;

      if (!assessments || assessments.length === 0) {
        app.innerHTML = `
          <div class="empty-state">
            <h2>Welcome${participant?.preferredName ? ', ' + escHtml(participant.preferredName) : ''}</h2>
            <p>You haven't completed any assessments yet. Take your first Sleep &amp; Recovery assessment to get started.</p>
            <a class="start-btn" href="/#signup">Start your first assessment</a>
          </div>
        `;
        return;
      }

      const completed = assessments.filter(a => a.status === 'completed');
      const inProgress = assessments.filter(a => a.status === 'started' || a.status === 'invited');

      let html = `
        <div class="eyebrow">Your dashboard</div>
        <h1>Welcome${participant?.preferredName ? ', ' + escHtml(participant.preferredName) : ''}</h1>
        <p class="muted" style="font-size:15px;margin:0 0 28px">You have ${completed.length} completed ${completed.length === 1 ? 'assessment' : 'assessments'}${inProgress.length ? ` and ${inProgress.length} in progress` : ''}.</p>
      `;

      // ── Progress-over-time chart (only with 2+ completed) ──
      html += renderProgressChart(completed);

      // ── Completed assessments ──
      for (const a of completed) {
        const summary = a.resultSummary || {};
        const domains = a.domainScores || [];

        html += `
          <div class="card">
            <div class="assessment-name">${escHtml(a.type?.name || 'Assessment')} · v${a.type?.version || ''}</div>
            <div class="score-row">
              <span class="score-big">${Math.round(Number(a.overallScore || 0))}<small>/100</small></span>
            </div>
            <div class="completed-date">Completed ${formatDate(a.completedAt)}</div>
            <p class="muted" style="font-size:14px;line-height:1.6;margin:0 0 16px">${escHtml(summary.description || '')}</p>
        `;

        // ── Domain scores ──
        if (domains.length > 0) {
          html += `<h2>Your scores</h2>`;
          for (const d of domains) {
            const label = DOMAIN_LABELS[d.domain] || d.domain;
            const pct = Math.max(0, Math.min(100, Number(d.score || 0)));
            html += `
              <div class="domain">
                <div class="domain-head">
                  <span>${escHtml(label)}</span>
                  <strong>${Math.round(pct)}/100</strong>
                </div>
                <div class="bar"><span style="width:${pct}%"></span></div>
              </div>
            `;
          }
        }

        // ── Strongest / weakest ──
        if (summary.strongest_domain_label || summary.weakest_domain_label) {
          html += `<div class="result-box">`;
          if (summary.strongest_domain_label) {
            html += `<h3>Strongest area</h3><div class="muted">${escHtml(summary.strongest_domain_label)}</div>`;
          }
          if (summary.weakest_domain_label) {
            html += `<h3 style="margin-top:12px">Biggest opportunity</h3><div class="muted">${escHtml(summary.weakest_domain_label)}</div>`;
          }
          html += `</div>`;
        }

        // ── Warnings ──
        const warnings = summary.warnings || [];
        for (const w of warnings) {
          html += `<div class="warning ${w.level === 'important' ? 'important' : ''}"><strong>${escHtml(w.title)}</strong> — ${escHtml(w.text)}</div>`;
        }

        // ── Recommendations ──
        const recs = summary.recommendations || [];
        if (recs.length > 0) {
          html += `<h2 style="margin-top:22px">Personalized recommendations</h2><div class="recs">`;
          for (let i = 0; i < recs.length; i++) {
            const recKey = `zist:rec:${recs[i].title}|${a.completedAt || ''}`;
            const recDone = localStorage.getItem(recKey) === '1';
            html += `<label class="rec rec-checkable${recDone ? ' rec-done' : ''}" data-rec-key="${escHtml(recKey)}"><input type="checkbox" class="rec-checkbox"${recDone ? ' checked' : ''} /><div class="rec-content"><h3>${i + 1}. ${escHtml(recs[i].title)}</h3><div class="muted" style="font-size:13px;line-height:1.6">${escHtml(recs[i].text)}</div></div></label>`;
          }
          html += `</div>`;
        }

        html += `</div>`;
      }

      // ── In-progress assessments ──
      for (const a of inProgress) {
        html += `
          <div class="card">
            <div class="assessment-name">${escHtml(a.type?.name || 'Assessment')} · In progress</div>
            <p class="muted" style="font-size:14px;margin:0">Started ${formatDate(a.startedAt)}</p>
            <a class="start-btn" href="/a/${a.accessToken}" style="margin-top:16px">Continue assessment</a>
          </div>
        `;
      }

      // ── CTA: take another assessment ──
      if (completed.length > 0) {
        html += `
          <div class="card" style="text-align:center;border-style:dashed">
            <h2>Track your progress</h2>
            <p class="muted" style="font-size:14px;margin:0 0 20px">Retake the Sleep &amp; Recovery assessment to see how your scores change over time.</p>
            <button class="retake-btn" id="retake-btn">Retake Sleep &amp; Recovery assessment</button>
          </div>
        `;
      }

      app.innerHTML = html;

      // ── Wire up recommendation checkboxes (localStorage persistence) ──
      document.querySelectorAll('.rec-checkbox').forEach(cb => {
        cb.addEventListener('change', () => {
          const label = cb.closest('.rec-checkable');
          if (!label) return;
          const key = label.dataset.recKey;
          try {
            localStorage.setItem(key, cb.checked ? '1' : '0');
          } catch (_) { /* localStorage may be unavailable */ }
          label.classList.toggle('rec-done', cb.checked);
        });
      });

      // ── Wire up the reassessment button ──
      const retakeBtn = document.getElementById('retake-btn');
      if (retakeBtn) retakeBtn.addEventListener('click', retakeAssessment);

      // ── Render feedback widget ──
      renderFeedback(session);
    }

    init();
  </script>
</body>
</html>
