<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sleep & Recovery | Zist Health</title>
  <style>
    :root {
      --ink: #16211d;
      --muted: #66736e;
      --line: #dce5e1;
      --soft: #f4f8f6;
      --brand: #1d5b4f;
      --brand2: #2f7d6c;
      --warn: #8a4b12;
      --warnbg: #fff7ed;
      --danger: #8a2330;
      --dangerbg: #fff1f2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f4f8f6 0, #ffffff 34%);
      color: var(--ink);
    }
    .shell { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 72px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 38px; }
    .mark { width: 34px; height: 34px; border-radius: 50%; background: var(--brand); display: grid; place-items:center; color:white; font-weight:900; }
    .card { background: white; border: 1px solid var(--line); border-radius: 24px; padding: 30px; box-shadow: 0 20px 60px rgba(23, 52, 44, .07); }
    h1 { font-size: clamp(30px, 5vw, 46px); line-height: 1.04; letter-spacing: -0.04em; margin: 0 0 16px; }
    h2 { font-size: 26px; letter-spacing: -0.03em; margin: 0 0 12px; }
    h3 { font-size: 18px; margin: 0 0 8px; }
    p { line-height: 1.65; }
    .muted { color: var(--muted); }
    .eyebrow { color: var(--brand); font-size: 13px; text-transform: uppercase; letter-spacing: .12em; font-weight: 800; margin-bottom: 12px; }
    .progress-wrap { margin-bottom: 22px; }
    .progress-meta { display:flex; justify-content:space-between; color:var(--muted); font-size:13px; margin-bottom:8px; }
    .progress { height: 8px; background: #e9efec; border-radius: 100px; overflow:hidden; }
    .progress > div { height:100%; background:var(--brand2); width:0; transition: width .2s ease; }
    .question { font-size: 27px; line-height: 1.25; letter-spacing:-0.025em; margin: 12px 0 8px; }
    .help { color:var(--muted); margin: 0 0 20px; }
    .options { display:grid; gap:10px; margin-top:20px; }
    .option { display:flex; gap:12px; align-items:flex-start; border:1px solid var(--line); border-radius:15px; padding:14px 15px; cursor:pointer; transition:.15s ease; }
    .option:hover { border-color:#a9c2ba; background:#fbfdfc; }
    .option:has(input:checked) { border-color:var(--brand2); background:#eff8f4; }
    .option input { margin-top:3px; accent-color:var(--brand); }
    input[type="text"] { width:100%; border:1px solid var(--line); border-radius:14px; padding:14px 15px; font:inherit; color:var(--ink); outline:none; }
    input[type="text"]:focus { border-color:var(--brand2); box-shadow:0 0 0 3px rgba(47,125,108,.12); }
    .other-input { margin-top:10px; }
    .actions { display:flex; justify-content:space-between; gap:12px; margin-top:28px; }
    button, .button { border:0; border-radius:999px; padding:13px 20px; font:inherit; font-weight:750; cursor:pointer; text-decoration:none; display:inline-flex; justify-content:center; align-items:center; }
    .primary { background:var(--brand); color:white; }
    .secondary { background:var(--soft); color:var(--ink); }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .error { color:var(--danger); background:var(--dangerbg); border-radius:12px; padding:11px 13px; margin-top:16px; display:none; }
    .consent { display:flex; gap:12px; border:1px solid var(--line); background:var(--soft); padding:16px; border-radius:14px; margin:24px 0; }
    .consent input { margin-top:4px; accent-color:var(--brand); }
    .score { font-size:72px; line-height:1; letter-spacing:-.06em; font-weight:850; margin:12px 0; }
    .score small { font-size:22px; color:var(--muted); letter-spacing:0; font-weight:650; }
    .domain { margin:18px 0; }
    .domain-head { display:flex; justify-content:space-between; gap:10px; margin-bottom:7px; font-size:14px; }
    .bar { height:9px; background:#edf1ef; border-radius:99px; overflow:hidden; }
    .bar span { display:block; height:100%; background:var(--brand2); border-radius:99px; }
    .result-box { padding:18px; border-radius:16px; background:var(--soft); margin:18px 0; }
    .warning { padding:16px; border-radius:14px; margin:12px 0; background:var(--warnbg); border:1px solid #fed7aa; }
    .warning.important { background:var(--dangerbg); border-color:#fecdd3; }
    .recs { display:grid; gap:12px; margin-top:16px; }
    .rec { border:1px solid var(--line); border-radius:16px; padding:16px; }
    .cta { background:var(--brand); color:white; padding:22px; border-radius:18px; margin-top:26px; }
    .cta p { color:#dcebe6; }
    .loading { text-align:center; padding:80px 20px; color:var(--muted); }
    .foot { margin-top:24px; font-size:12px; color:var(--muted); line-height:1.6; }
    @media (max-width: 600px) {
      .shell { width:min(100% - 20px, 760px); padding-top:18px; }
      .card { padding:22px 18px; border-radius:20px; }
      .question { font-size:23px; }
      .actions { flex-direction:column-reverse; }
      button, .button { width:100%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand"><div class="mark">Z</div><div>Zist Health</div></div>
    <div id="app" class="card"><div class="loading">Loading your assessment...</div></div>
  </main>

<script>
(() => {
  const app = document.getElementById('app');

  // -------------------------------------------------------
  // TOKEN
  // Supports both:
  // /a/<token>
  // /assessment.html?token=<token>
  // -------------------------------------------------------

  const params = new URLSearchParams(location.search);

  let token = params.get('token');

  if (!token) {
    const parts = location.pathname
      .split('/')
      .filter(Boolean);

    if (
      parts[0] === 'a' &&
      parts[1]
    ) {
      token = parts[1];
    }
  }


  // -------------------------------------------------------
  // STATE
  // -------------------------------------------------------

  const state = {
    payload: null,
    questions: [],
    answers: {},
    index: 0,
    consentAccepted: false,
    policyVersion: '2026-09-v2',
  };


  // -------------------------------------------------------
  // HELPERS
  // -------------------------------------------------------

  const esc = (s = '') =>
    String(s).replace(
      /[&<>"']/g,
      c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;',
      }[c])
    );


  const answerValue = (answer) =>
    (
      answer &&
      typeof answer === 'object' &&
      !Array.isArray(answer) &&
      'value' in answer
    )
      ? answer.value
      : answer;


  const multiValues = (answer) => {
    if (Array.isArray(answer)) {
      return answer;
    }

    if (
      answer &&
      Array.isArray(answer.values)
    ) {
      return answer.values;
    }

    return [];
  };


  // -------------------------------------------------------
  // CONDITIONAL QUESTION LOGIC
  //
  // Supports:
  //
  // { equals: "yes" }
  // { in: [...] }
  // { contains: "x" }
  // { not_contains: "none" }
  // -------------------------------------------------------

  function visible(q) {

    // Hide About You questions when we already know
    // this participant's profile.
    if (
      state.payload?.participant?.profileComplete &&
      q.profile_field
    ) {
      return false;
    }

    if (!q.display_if) {
      return true;
    }

    const raw =
      state.answers[
        q.display_if.question_key
      ];

    const current =
      answerValue(raw);

    const values =
      multiValues(raw);


    if (
      Array.isArray(
        q.display_if.in
      )
    ) {
      return q.display_if.in.includes(
        current
      );
    }


    if (
      Object.prototype.hasOwnProperty.call(
        q.display_if,
        'equals'
      )
    ) {
      return (
        current ===
        q.display_if.equals
      );
    }


    if (
      Object.prototype.hasOwnProperty.call(
        q.display_if,
        'contains'
      )
    ) {
      return values.includes(
        q.display_if.contains
      );
    }


    if (
      Object.prototype.hasOwnProperty.call(
        q.display_if,
        'not_contains'
      )
    ) {
      return (
        values.length > 0 &&
        !values.includes(
          q.display_if.not_contains
        )
      );
    }


    return true;
  }


  function visibleQuestions() {
    return state.questions.filter(
      visible
    );
  }


  // -------------------------------------------------------
  // PREFILL ABOUT YOU
  // -------------------------------------------------------

  function prefillProfile() {

    const p =
      state.payload
        ?.participant
        ?.profile;

    if (!p) {
      return;
    }

    for (
      const q
      of state.questions.filter(
        q => q.profile_field
      )
    ) {

      const stored =
        p[q.profile_field];

      if (
        stored === null ||
        stored === undefined
      ) {
        continue;
      }


      if (
        q.question_type ===
        'multiple_choice'
      ) {

        const storedItems =
          Array.isArray(stored)
            ? stored
            : [];

        const values = [];

        let otherText = '';


        for (
          const storedItem
          of storedItems
        ) {

          const match =
            q.options?.find(
              option =>
                option.label === storedItem
            );

          if (match) {
            values.push(
              match.value
            );
          } else {
            const other =
              q.options?.find(
                option =>
                  option.requires_text
              );

            if (other) {
              values.push(
                other.value
              );

              otherText =
                storedItem;
            }
          }
        }


        state.answers[
          q.question_key
        ] = {
          values,
          otherText,
        };

      } else if (
        q.question_type ===
        'text'
      ) {

        state.answers[
          q.question_key
        ] = stored;

      } else {

        const match =
          q.options?.find(
            option =>
              option.label === stored
          );

        if (match) {
          state.answers[
            q.question_key
          ] = match.value;
        }
      }
    }
  }


  // -------------------------------------------------------
  // LOAD ASSESSMENT
  // -------------------------------------------------------

  async function load() {

    if (!token) {
      return fail(
        'This assessment link is missing its secure token.'
      );
    }


    try {

      const response =
        await fetch(
          `/api/assessment/get?token=${encodeURIComponent(token)}`,
          {
            cache: 'no-store',
          }
        );


      const data =
        await response.json();


      if (!response.ok) {
        throw new Error(
          data.error ||
          'Could not load assessment.'
        );
      }


      // Your get.js returns:
      //
      // {
      //   success: true,
      //   assessment: {...}
      // }

      const assessment =
        data.assessment || data;


      const participant =
        assessment.participant || {};


      const profileComplete =
        Boolean(
          participant.preferred_name &&
          participant.age_range &&
          participant.gender &&
          participant.sex_at_birth &&
          Array.isArray(
            participant.race_ethnicity
          ) &&
          participant.race_ethnicity.length
        );


      state.payload = {

        participant: {
          preferredName:
            participant.preferred_name ||
            '',

          profileComplete,

          profile:
            participant,
        },

        instance: {
          id:
            assessment.id,

          status:
            assessment.status,

          overallScore:
            assessment.overallScore,
        },

        type:
          assessment.type,

        resultSummary:
          assessment.resultSummary,

        domainScores:
          assessment.domainScores ||
          [],

        responses:
          assessment.responses ||
          [],
      };


      state.questions =
        assessment.questions ||
        [];


      prefillProfile();


      // -----------------------------------
      // Already completed assessment
      // -----------------------------------

      if (
        assessment.status ===
        'completed'
      ) {

        renderResults({
          overallScore:
            assessment.overallScore,

          domainScores:
            assessment.domainScores ||
            [],

          summary:
            assessment.resultSummary ||
            {},
        });

      } else {

        renderIntro();
      }

    } catch (error) {

      fail(
        error.message
      );
    }
  }


  // -------------------------------------------------------
  // ERROR PAGE
  // -------------------------------------------------------

  function fail(message) {

    app.innerHTML = `
      <div class="eyebrow">
        Zist Health
      </div>

      <h2>
        We could not open this assessment
      </h2>

      <p class="muted">
        ${esc(message)}
      </p>
    `;
  }


  // -------------------------------------------------------
  // INTRO
  // -------------------------------------------------------

  function renderIntro() {

    const preferredName =
      state.payload
        ?.participant
        ?.preferredName;


    const name =
      preferredName
        ? `, ${esc(preferredName)}`
        : '';


    app.innerHTML = `

      <div class="eyebrow">
        Sleep & Recovery
      </div>

      <h1>
        Understand how well your sleep is supporting you${name}.
      </h1>

      <p class="muted">
        This assessment looks at six dimensions of sleep:
        duration, regularity, satisfaction, continuity,
        daytime alertness, and how well your sleep timing
        aligns with your body.
      </p>

      <p class="muted">
        We'll also ask about factors that may affect your
        sleep and a few sleep-health and safety questions.
        Think about your typical sleep over the past
        <strong>2 weeks</strong>.
      </p>

      <p class="muted">
        It takes about 5 minutes.
      </p>


      <div class="consent">

        <input
          id="consent"
          type="checkbox"
        />

        <label for="consent">
          Zist may store my responses and use them to
          calculate wellness scores and provide personalized
          wellness guidance. I understand this assessment
          does not provide medical diagnosis or treatment.
        </label>

      </div>


      <button
        id="begin"
        class="primary"
      >
        Begin assessment
      </button>


      <div class="foot">
        Your assessment link is unique to you.
        Do not forward it to someone else.
      </div>
    `;


    document
      .getElementById('consent')
      .addEventListener(
        'change',
        event => {

          state.consentAccepted =
            event.target.checked;
        }
      );


    document
      .getElementById('begin')
      .addEventListener(
        'click',
        () => {

          if (
            !state.consentAccepted
          ) {

            const box =
              document.querySelector(
                '.consent'
              );

            box.style.borderColor =
              '#fda4af';

            return;
          }

          state.index = 0;

          renderQuestion();
        }
      );
  }


  // -------------------------------------------------------
  // QUESTION
  // -------------------------------------------------------

  function renderQuestion() {

    const qs =
      visibleQuestions();


    if (!qs.length) {

      return fail(
        'No questions are configured for this assessment.'
      );
    }


    if (
      state.index >=
      qs.length
    ) {
      state.index =
        qs.length - 1;
    }


    const q =
      qs[state.index];


    const pct =
      Math.round(
        (
          (
            state.index +
            1
          ) /
          qs.length
        ) *
        100
      );


    app.innerHTML = `

      <div class="progress-wrap">

        <div class="progress-meta">

          <span>
            ${esc(q.section || '')}
          </span>

          <span>
            ${state.index + 1}
            of
            ${qs.length}
          </span>

        </div>

        <div class="progress">
          <div
            style="width:${pct}%"
          ></div>
        </div>

      </div>


      <div class="question">
        ${esc(q.prompt)}
      </div>


      ${
        q.help_text
          ? `
            <p class="help">
              ${esc(q.help_text)}
            </p>
          `
          : ''
      }


      <div id="input"></div>


      <div
        id="err"
        class="error"
      ></div>


      <div class="actions">

        <button
          id="back"
          class="secondary"
          ${
            state.index === 0
              ? 'disabled'
              : ''
          }
        >
          Back
        </button>


        <button
          id="next"
          class="primary"
        >
          ${
            state.index ===
            qs.length - 1
              ? 'See my results'
              : 'Continue'
          }
        </button>

      </div>
    `;


    renderInput(q);


    document
      .getElementById('back')
      .addEventListener(
        'click',
        () => {

          state.index--;

          renderQuestion();
        }
      );


    document
      .getElementById('next')
      .addEventListener(
        'click',
        async () => {

          const validationError =
            validate(q);


          if (
            validationError
          ) {
            return showError(
              validationError
            );
          }


          // Under 18 check
          if (
            q.question_key ===
              'q3' &&
            answerValue(
              state.answers.q3
            ) === 'under_18'
          ) {

            return showError(
              'The current Zist Sleep & Recovery assessment is designed for adults age 18 and older.'
            );
          }


          const currentQuestions =
            visibleQuestions();


          if (
            state.index >=
            currentQuestions.length -
              1
          ) {

            await submit();

          } else {

            state.index++;

            renderQuestion();
          }
        }
      );
  }


  // -------------------------------------------------------
  // QUESTION INPUT
  // -------------------------------------------------------

  function renderInput(q) {

    const host =
      document.getElementById(
        'input'
      );


    const existing =
      state.answers[
        q.question_key
      ];


    // -----------------------------------
    // TEXT
    // -----------------------------------

    if (
      q.question_type ===
      'text'
    ) {

      host.innerHTML = `

        <input
          id="text-answer"
          type="text"
          autocomplete="name"
          value="${esc(existing || '')}"
          placeholder="Your answer"
        />

      `;


      document
        .getElementById(
          'text-answer'
        )
        .addEventListener(
          'input',
          event => {

            state.answers[
              q.question_key
            ] =
              event.target.value;
          }
        );


      return;
    }


    // -----------------------------------
    // SINGLE CHOICE
    // -----------------------------------

    if (
      q.question_type ===
      'single_choice'
    ) {

      const selected =
        answerValue(existing);


      host.innerHTML = `

        <div class="options">

          ${
            (
              q.options ||
              []
            )
              .map(
                option => `

                  <label class="option">

                    <input
                      type="radio"
                      name="choice"
                      value="${esc(option.value)}"
                      ${
                        selected ===
                        option.value
                          ? 'checked'
                          : ''
                      }
                    />

                    <span>
                      ${esc(option.label)}
                    </span>

                  </label>

                `
              )
              .join('')
          }

        </div>

        <div id="other-wrap"></div>
      `;


      host
        .querySelectorAll(
          'input[type=radio]'
        )
        .forEach(
          input =>
            input.addEventListener(
              'change',
              event => {

                const option =
                  q.options.find(
                    option =>
                      option.value ===
                      event.target.value
                  );


                const previousText =
                  existing &&
                  typeof existing ===
                    'object'
                    ? existing.otherText ||
                      ''
                    : '';


                state.answers[
                  q.question_key
                ] =
                  option?.requires_text
                    ? {
                        value:
                          event.target
                            .value,

                        otherText:
                          previousText,
                      }
                    : event.target
                        .value;


                renderOther(q);
              }
            )
        );


      renderOther(q);

      return;
    }


    // -----------------------------------
    // MULTIPLE CHOICE
    // -----------------------------------

    if (
      q.question_type ===
      'multiple_choice'
    ) {

      const selected =
        multiValues(
          existing
        );


      host.innerHTML = `

        <div class="options">

          ${
            (
              q.options ||
              []
            )
              .map(
                option => `

                  <label class="option">

                    <input
                      type="checkbox"
                      value="${esc(option.value)}"
                      ${
                        selected.includes(
                          option.value
                        )
                          ? 'checked'
                          : ''
                      }
                    />

                    <span>
                      ${esc(option.label)}
                    </span>

                  </label>

                `
              )
              .join('')
          }

        </div>

        <div id="other-wrap"></div>
      `;


      host
        .querySelectorAll(
          'input[type=checkbox]'
        )
        .forEach(
          input =>
            input.addEventListener(
              'change',
              event => {

                // These answers cannot coexist
                // with other selections.
                const exclusive = [
                  'none',
                  'nothing',
                  'prefer_not_to_answer',
                ];


                let values = [
                  ...multiValues(
                    state.answers[
                      q.question_key
                    ]
                  ),
                ];


                if (
                  event.target.checked
                ) {

                  if (
                    exclusive.includes(
                      event.target.value
                    )
                  ) {

                    values = [
                      event.target
                        .value,
                    ];

                  } else {

                    values =
                      values
                        .filter(
                          value =>
                            !exclusive.includes(
                              value
                            )
                        )
                        .concat(
                          event.target
                            .value
                        );
                  }

                } else {

                  values =
                    values.filter(
                      value =>
                        value !==
                        event.target
                          .value
                    );
                }


                values = [
                  ...new Set(values),
                ];


                const old =
                  state.answers[
                    q.question_key
                  ];


                state.answers[
                  q.question_key
                ] = {
                  values,

                  otherText:
                    old &&
                    old.otherText
                      ? old.otherText
                      : '',
                };


                renderInput(q);
              }
            )
        );


      renderOther(q);
    }
  }


  // -------------------------------------------------------
  // "OTHER" TEXT FIELD
  // -------------------------------------------------------

  function renderOther(q) {

    const wrap =
      document.getElementById(
        'other-wrap'
      );


    if (!wrap) {
      return;
    }


    const answer =
      state.answers[
        q.question_key
      ];


    const selected =
      q.question_type ===
      'multiple_choice'
        ? multiValues(answer)
        : [
            answerValue(answer),
          ];


    const needsOther =
      (
        q.options ||
        []
      ).some(
        option =>
          option.requires_text &&
          selected.includes(
            option.value
          )
      );


    if (!needsOther) {

      wrap.innerHTML = '';

      return;
    }


    const value =
      answer &&
      typeof answer ===
        'object'
        ? answer.otherText ||
          ''
        : '';


    wrap.innerHTML = `

      <input
        class="other-input"
        id="other-answer"
        type="text"
        value="${esc(value)}"
        placeholder="Please specify"
      />

    `;


    document
      .getElementById(
        'other-answer'
      )
      .addEventListener(
        'input',
        event => {

          if (
            q.question_type ===
            'multiple_choice'
          ) {

            state.answers[
              q.question_key
            ] = {
              values:
                multiValues(
                  answer
                ),

              otherText:
                event.target.value,
            };

          } else {

            state.answers[
              q.question_key
            ] = {
              value:
                answerValue(
                  answer
                ),

              otherText:
                event.target.value,
            };
          }
        }
      );
  }


  // -------------------------------------------------------
  // VALIDATION
  // -------------------------------------------------------

  function validate(q) {

    if (!q.required) {
      return null;
    }


    const answer =
      state.answers[
        q.question_key
      ];


    const empty =
      answer === null ||
      answer === undefined ||
      answer === '' ||
      (
        Array.isArray(answer) &&
        !answer.length
      ) ||
      (
        answer &&
        Array.isArray(
          answer.values
        ) &&
        !answer.values.length
      );


    if (empty) {

      return (
        'Please answer this question before continuing.'
      );
    }


    const values =
      q.question_type ===
      'multiple_choice'
        ? multiValues(answer)
        : [
            answerValue(
              answer
            ),
          ];


    const requiresText =
      (
        q.options ||
        []
      ).some(
        option =>
          option.requires_text &&
          values.includes(
            option.value
          )
      );


    if (
      requiresText &&
      !(
        answer &&
        typeof answer ===
          'object' &&
        String(
          answer.otherText ||
          ''
        ).trim()
      )
    ) {

      return (
        'Please specify your answer.'
      );
    }


    return null;
  }


  function showError(message) {

    const el =
      document.getElementById(
        'err'
      );


    el.textContent =
      message;

    el.style.display =
      'block';
  }


  // -------------------------------------------------------
  // SUBMIT
  // -------------------------------------------------------

  async function submit() {

    const button =
      document.getElementById(
        'next'
      );


    button.disabled = true;

    button.textContent =
      'Saving...';


    try {

      const response =
        await fetch(
          '/api/assessment/submit',
          {
            method: 'POST',

            headers: {
              'Content-Type':
                'application/json',
            },

            body:
              JSON.stringify({
                token,

                answers:
                  state.answers,

                consentAccepted:
                  state.consentAccepted,

                policyVersion:
                  state.policyVersion,
              }),
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          'Could not save your assessment.'
        );
      }


      renderResults(
        data.result
      );

    } catch (error) {

      button.disabled =
        false;

      button.textContent =
        'See my results';

      showError(
        error.message
      );
    }
  }


  // -------------------------------------------------------
  // V2 DOMAIN NAMES
  // -------------------------------------------------------

  const domainNames = {

    duration:
      'Sleep Duration',

    regularity:
      'Sleep Regularity',

    satisfaction:
      'Sleep Satisfaction',

    continuity:
      'Sleep Continuity',

    alertness:
      'Daytime Alertness & Recovery',

    timing:
      'Sleep Timing & Alignment',
  };


  // -------------------------------------------------------
  // RESULTS
  // -------------------------------------------------------

  function renderResults(
    result
  ) {

    const summary =
      result.summary || {};


    const domains =
      Array.isArray(
        result.domainScores
      )
        ? result.domainScores
        : Object.entries(
            result.domainScores ||
            {}
          ).map(
            ([
              domain,
              score,
            ]) => ({
              domain,
              score,
            })
          );


    const warnings =
      summary.warnings ||
      [];


    const recommendations =
      summary.recommendations ||
      [];


    app.innerHTML = `

      <div class="eyebrow">
        Your Sleep & Recovery Results
      </div>


      <h1>
        ${
          esc(
            summary.band ||
            'Your results'
          )
        }
      </h1>


      <div class="score">

        ${
          Math.round(
            Number(
              result.overallScore ||
              0
            )
          )
        }

        <small>
          /100
        </small>

      </div>


      <p class="muted">
        ${
          esc(
            summary.description ||
            ''
          )
        }
      </p>


      <div class="result-box">

        <h3>
          Strongest area
        </h3>

        <div>
          ${
            esc(
              summary
                .strongest_domain_label ||
              ''
            )
          }
        </div>

      </div>


      <div class="result-box">

        <h3>
          Biggest opportunity
        </h3>

        <div>
          ${
            esc(
              summary
                .weakest_domain_label ||
              ''
            )
          }
        </div>

      </div>


      <h2 style="margin-top:30px">
        Your six sleep domains
      </h2>


      ${
        domains
          .map(
            domain => `

              <div class="domain">

                <div class="domain-head">

                  <span>
                    ${
                      esc(
                        domainNames[
                          domain.domain
                        ] ||
                        domain.domain
                      )
                    }
                  </span>

                  <strong>
                    ${
                      Math.round(
                        Number(
                          domain.score
                        )
                      )
                    }/100
                  </strong>

                </div>


                <div class="bar">

                  <span
                    style="
                      width:${
                        Math.max(
                          0,
                          Math.min(
                            100,
                            Number(
                              domain.score
                            )
                          )
                        )
                      }%
                    "
                  ></span>

                </div>

              </div>

            `
          )
          .join('')
      }


      ${
        warnings.length
          ? `

            <h2 style="margin-top:30px">
              Health signals worth attention
            </h2>

            ${
              warnings
                .map(
                  warning => `

                    <div
                      class="
                        warning
                        ${
                          warning.level ===
                          'important'
                            ? 'important'
                            : ''
                        }
                      "
                    >

                      <h3>
                        ${
                          esc(
                            warning.title
                          )
                        }
                      </h3>

                      <div>
                        ${
                          esc(
                            warning.text
                          )
                        }
                      </div>

                    </div>

                  `
                )
                .join('')
            }

          `
          : ''
      }


      ${
        recommendations.length
          ? `

            <h2 style="margin-top:30px">
              Your next ${
                recommendations.length
              } ${
                recommendations.length ===
                1
                  ? 'action'
                  : 'actions'
              }
            </h2>


            <div class="recs">

              ${
                recommendations
                  .map(
                    (
                      recommendation,
                      index
                    ) => `

                      <div class="rec">

                        <h3>
                          ${
                            index +
                            1
                          }.
                          ${
                            esc(
                              recommendation
                                .title
                            )
                          }
                        </h3>

                        <div class="muted">
                          ${
                            esc(
                              recommendation
                                .text
                            )
                          }
                        </div>

                      </div>

                    `
                  )
                  .join('')
              }

            </div>

          `
          : ''
      }


      <div class="cta">

        <h2>
          Want a personalized health plan?
        </h2>

        <p>
          Create your Zist profile to combine
          your Sleep & Recovery results with
          your other assessments and build a
          personalized wellness plan.
        </p>

        <a
          class="button secondary"
          href="/register"
        >
          Create my Zist account
        </a>

      </div>


      <div class="foot">
        The Zist Sleep & Recovery Score is an
        evidence-informed wellness measure,
        not a clinical diagnosis. If symptoms
        concern you, consider discussing them
        with a qualified healthcare
        professional.
      </div>
    `;
  }


  load();

})();
</script>
</body>
</html>
